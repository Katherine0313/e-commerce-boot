spring:
  profiles:
    active: dev
  application:
    name: product-service
  cloud:
    nacos:
      discovery:
        # Nacos 3.x：客户端通信仍是 8848（gRPC 9848/9849），控制台另走 8080 端口
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
  datasource:
    # 连接凭据不写进版本库：本地值在 application-dev.yml（已被 gitignore），
    # 生产由环境变量提供。用户名/密码故意不给默认值，缺失就启动失败。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: MyHikariCP
  data:
    redis:
      # 密码不写在 yml 里：生产通过环境变量 SPRING_DATA_REDIS_PASSWORD 注入，
      # Spring Boot 会自动映射到 spring.data.redis.password；本地无密码时不设该变量即可
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # 超时压短：Redis 不可用时快速失败，分类接口才能走降级查库，而不是卡 10 秒
      connect-timeout: 2s
      timeout: 2s
  servlet:
    multipart:
      # 图片/视频上传限制：单文件 50MB，整个请求 51MB 留余量。
      # 这里只是总闸，实际按类型分级在 UploadServiceImpl：图片 5MB、视频 50MB。
      # 后台前端上传前会按展示规格压缩（后台 utils/image-spec.js），正常不会碰到这两个上限。
      # 超限由 GlobalExceptionHandler 转成 413 + 可读提示。
      max-file-size: 50MB
      max-request-size: 51MB
server:
  port: 9003

# jwt.secret 统一从环境变量 JWT_SECRET 读取。当前接口都在免登录白名单里，暂不校验令牌，
# 但 common 的 JwtProperties 启动时校验非空，未设置 JWT_SECRET 时服务直接启动失败。
jwt:
  secret: ${JWT_SECRET}
  expire: 604800

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  # mappers/ 下按业务模块分子目录存放，** 递归匹配
  mapper-locations: classpath*:mappers/**/*.xml

# 接口文档：默认关闭作为安全兜底（生产不暴露 /swagger-ui.html 和 /v3/api-docs），开发期在 application-dev.yml 开启
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

logging:
  level:
    ecommerce.product.mapper: ${SQL_DEBUG:INFO}

# Python 推荐服务地址（猜你喜欢）；超时毫秒，防止慢调用拖垮商品浏览
recommend:
  # Python 推荐服务地址；Docker 内由 compose 的 RECOMMEND_BASE_URL 覆盖为 http://ai-service:8000
  base-url: ${RECOMMEND_BASE_URL:http://127.0.0.1:8000}
  # 首页场景宁可快速兜底，也不让 Python 慢调用拖住首屏
  connect-timeout: 300
  read-timeout: 500
