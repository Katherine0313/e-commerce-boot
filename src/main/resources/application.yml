spring:
  application:
    name: e-commerce-boot
  main:
    log-startup-info: false
  datasource:
    url: jdbc:mysql://localhost:3306/e_commerce_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: MyHikariCP

person:
  name: admin
  age: 28

user:
  salary: 10000
  hobbies: sing,jump,rap,basketball
  birth: 2000/01/01


logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    com.zaxxer.hikari: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: WARN

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mappers/*.xml
