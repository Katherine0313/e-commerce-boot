spring:
  application:
    name: shop-service
  cloud:
    nacos:
      discovery:
        # Nacos 3.x：客户端通信仍是 8848（gRPC 9848/9849），控制台另走 8080 端口
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}

server:
  port: 9002

# jwt.secret 统一从环境变量 JWT_SECRET 读取：占位服务暂未接业务，但 common 的
# JwtProperties/WeChatProperties 启动时校验非空，未设置 JWT_SECRET 时服务直接启动失败。
jwt:
  secret: ${JWT_SECRET}
  expire: 604800
wechat:
  appid: placeholder-appid
  secret: placeholder-secret

# 占位服务没有 Controller，接口文档一律关闭，避免暴露
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
