# 开发期中间件编排：Docker 只起 Nacos；MySQL 复用本机已装的 MySQL80（3306 已占用，库 e_commerce_db 已建好）
#
# 启动：docker compose up -d
# 停止：docker compose down
# 查看：docker compose ps
# 日志：docker compose logs -f nacos
#
# 端口说明：
#   Nacos  8848       客户端通信（SCA 注册/配置，各服务 application.yml 里的 server-addr）
#   Nacos  9848       gRPC 客户端长连接（必须映射，否则服务心跳上报会失败）
#   Nacos  9849       gRPC 服务端监听
#   Nacos  ->8080     Nacos 3.x 控制台（映射到宿主 18080，避开 gateway 的 8080）
#
# Nacos 3.x 默认开启鉴权，且 2.2.1+ 移除了鉴权变量的默认值，必须显式配置否则启动报错。
# 客户端凭据在业务服务 application.yml 里，默认 nacos/nacos，与此处默认账号对齐。

services:
  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos
    environment:
      MODE: standalone                                  # 单机模式，内嵌 derby 存储，不依赖 MySQL
      NACOS_AUTH_ENABLE: "false"                        # 开发期关闭鉴权（3.x 默认开启，但默认账号机制和 2.x 不同，开启后 nacos/nacos 登录会报 User not found，生产再按需开启）
      NACOS_AUTH_TOKEN: SecretKey01234567890123456789012345678901234567890123456789  # 启动脚本强制要求非空（即使关闭鉴权也要设，否则 exit 255）
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
      - "18080:8080"
    restart: unless-stopped
