# 生产部署（/www/java）：Nacos 3.1.1 + 9 个 Spring Boot 服务
# 使用前：
#   1. 每个服务目录放好 Dockerfile + 一个 jar
#   2. 本文件同目录放 .env（从 .env.example 复制并填值）
#   3. 先起 redis + nacos，等就绪再起其它服务
services:
  # Redis：只在 my-net 内网暴露，不写 ports，公网/宿主机都访问不到
  # 密码与服务共用 .env 里的 SPRING_DATA_REDIS_PASSWORD
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${SPRING_DATA_REDIS_PASSWORD}"]
    volumes:
      # AOF 落盘，容器重建数据不丢
      - ./redis-data:/data
    networks:
      - my-net

  nacos:
    image: nacos/nacos-server:v3.1.1
    container_name: nacos
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # Nacos 3.x 即使关闭鉴权也要求这个非空，否则启动脚本会报错
      NACOS_AUTH_TOKEN: SecretKey01234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: nacos
      NACOS_AUTH_IDENTITY_VALUE: nacos
      JVM_XMS: 128m
      JVM_XMX: 256m
    ports:
      # Nacos 3.x 控制台（容器内 8080）。只绑本机，通过 SSH 隧道访问，不对公网开放
      # 8848/9848/9849 只走 Docker 内网，不映射到宿主
      - "127.0.0.1:18080:8080"
    networks:
      - my-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-net

  shop-service:
    build: ./shop-service
    container_name: shop-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-net

  product-service:
    build: ./product-service
    container_name: product-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 商品图（upload/image）与用户头像（upload/avatar）共用同一个宿主目录
      - ./upload:/app/upload
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss256k -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"
    networks:
      - my-net

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss256k -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"
    networks:
      - my-net

  aftersale-service:
    build: ./aftersale-service
    container_name: aftersale-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-net

  user-service:
    build: ./user-service
    container_name: user-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 头像落盘 upload/avatar
      - ./upload:/app/upload
    networks:
      - my-net

  file-service:
    build: ./file-service
    container_name: file-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - my-net

  ai-agent-service:
    build: ./ai-agent-service
    container_name: ai-agent-service
    restart: always
    depends_on:
      - nacos
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss256k -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"
    networks:
      - my-net

  gateway:
    build: ./gateway
    container_name: gateway
    restart: always
    depends_on:
      - nacos
      - auth-service
      - shop-service
      - product-service
      - order-service
      - aftersale-service
      - user-service
      - file-service
      - ai-agent-service
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 只暴露给宿主机 Nginx；公网只开 443
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss256k -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"
    networks:
      - my-net

networks:
  my-net:
    driver: bridge
