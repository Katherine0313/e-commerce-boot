# 小程序 API 站：api.jiemids.com → 宿主机 gateway 8080
# SSL 证书由宝塔申请/管理，下面的 ssl_certificate 按宝塔生成的路径填写
server {
    listen 443 ssl http2;
    server_name api.jiemids.com;

    ssl_certificate     /www/server/panel/vhost/cert/api.jiemids.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/api.jiemids.com/privkey.pem;

    # 小程序上传上限（C 端视频 50MB，给足余量）
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 流式（SSE）必须关缓冲，否则首字会被攒住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /image/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /upload/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
