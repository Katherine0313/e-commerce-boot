spring:
  profiles:
    active: dev
  application:
    name: aftersale-service
  cloud:
    nacos:
      discovery:
        # Nacos 3.x：客户端通信仍是 8848（gRPC 9848/9849），控制台另走 8080 端口
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    # 连接凭据不写进版本库：本地值在 application-dev.yml（已被 gitignore），
    # 生产由环境变量提供。用户名/密码故意不给默认值，缺失就启动失败。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: MyHikariCP
  data:
    redis:
      # JwtInterceptor 读取管理员令牌失效标记；Redis 不可达时 fail-open（只影响踢下线）
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s

server:
  port: 9005

# Actuator：只暴露健康与指标，供 monitor-service 内网聚合；网关不转发 /actuator/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# jwt.secret 统一从环境变量 JWT_SECRET 读取，必须与 user-service 签发令牌用的密钥一致，
# 否则 aftersale-service 验签失败，/api/after-sales 等需登录接口会全部返回 401。
jwt:
  secret: ${JWT_SECRET}
  expire: 604800

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  # mappers/ 下按业务模块分子目录存放，** 递归匹配
  mapper-locations: classpath*:mappers/**/*.xml

# 接口文档：默认关闭作为安全兜底（生产不暴露 /swagger-ui.html 和 /v3/api-docs），开发期在 application-dev.yml 开启
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# 库存回补：委托 product-service 的内部接口（唯一出入库入口）
# 生产 Docker 内网用容器名 product-service；本地开发用 localhost:9003
stock:
  internal:
    url: ${STOCK_INTERNAL_URL:http://localhost:9003/internal/stock-write}

logging:
  level:
    ecommerce.aftersale.mapper: ${SQL_DEBUG:INFO}
