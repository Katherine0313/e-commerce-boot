spring:
  profiles:
    active: dev
  application:
    name: order-service
  # RabbitMQ：本地 Docker 默认 guest/guest；生产由环境变量提供
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  cloud:
    nacos:
      discovery:
        # Nacos 3.x：客户端通信仍是 8848（gRPC 9848/9849），控制台另走 8080 端口
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    # 连接凭据不写进版本库：本地值在 application-dev.yml（已被 gitignore），
    # 生产由环境变量提供。用户名/密码故意不给默认值，缺失就启动失败。
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: MyHikariCP
  # Redis：下单幂等用 StringRedisTemplate，连接走环境变量（本地默认 127.0.0.1:6379）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # 管理员令牌失效标记读取；限制 Redis 不可达时的最坏耗时
      timeout: 2s
  # 定时任务线程池：超时关单 / 自动确认 / 未支付提醒互不阻塞
  #（微信接口偶发慢调用时，不能拖住超时关单）
  task:
    scheduling:
      pool:
        size: 3

# 微信一次性订阅消息（订单未支付提醒）
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  subscribe:
    # 模板：订单未支付提醒（thing1 商品名称 / character_string5 订单编号 / amount7 订单金额 / time8 失效时间）
    template-id: ${WECHAT_SUBSCRIBE_TEMPLATE_ID:_81DMBgBaFGYXqh9Cb6X41-32EfTF2zpqdSqFPXjzOg}
    # 点击消息跳转的小程序页面（不带前导斜杠），点击后带 orderNo 参数
    page: ${WECHAT_SUBSCRIBE_PAGE:pages/order/pending-pay}
    # formal=正式版，trial=体验版，developer=开发版
    miniprogram-state: ${WECHAT_MINIPROGRAM_STATE:formal}
    # 订单 30 分钟失效，提前 10 分钟推（即下单后第 20 分钟）
    notify-before-minutes: ${WECHAT_NOTIFY_BEFORE_MINUTES:10}

server:
  port: 9004

# Actuator：只暴露健康与指标，供 system-service 内网聚合；网关不转发 /actuator/**
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

# jwt.secret 统一从环境变量 JWT_SECRET 读取，必须与 user-service 签发令牌用的密钥一致，
# 否则 order-service 验签失败，/api/cart、/api/orders 等需登录接口会全部返回 401。
# （common 的 JwtProperties 启动时校验非空，未设置 JWT_SECRET 时服务直接启动失败）
jwt:
  secret: ${JWT_SECRET}
  expire: 604800

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  # mappers/ 下按业务模块分子目录存放，** 递归匹配
  mapper-locations: classpath*:mappers/**/*.xml

# 接口文档：默认关闭作为安全兜底（生产不暴露 /swagger-ui.html 和 /v3/api-docs），开发期在 application-dev.yml 开启
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

# 动态定时任务：从 admin_monitor_task 读取启用任务，本服务只调度有对应 Runner 的行
monitor:
  # 慢 SQL 采集：只记超过阈值的语句，写入 admin_db_slow_sql 供数据库监控页展示
  sql:
    enabled: ${MONITOR_SQL_ENABLED:true}
    slow-threshold-ms: ${MONITOR_SQL_SLOW_MS:300}
    max-per-minute: ${MONITOR_SQL_MAX_PER_MIN:60}
  dynamic-task:
    enabled: true

# 库存扣减/回补：委托 product-service 的内部接口（唯一出入库入口）
# 生产 Docker 内网用容器名 product-service；本地开发用 localhost:9003
stock:
  internal:
    url: ${STOCK_INTERNAL_URL:http://localhost:9003/internal/stock-write}
    # 订单发货自动生成出库单的地址；留空时按 url 推导（同主机 /internal/stock-orders/shipment）
    # 默认推导可复用 STOCK_INTERNAL_URL 已配好的容器名，无需新增部署环境变量
    shipment-url: ${STOCK_SHIPMENT_URL:}

logging:
  level:
    ecommerce.order.mapper: ${SQL_DEBUG:INFO}

# AI 内部数据接口（/internal/ai/**）共享密钥：Python ai-service 通过 X-Internal-Token 头调用
# 生产必须由环境变量 AI_INTERNAL_TOKEN 注入；留空则内部接口一律拒绝（fail-closed）
ai:
  internal:
    token: ${AI_INTERNAL_TOKEN:}
