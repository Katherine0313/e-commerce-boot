spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
    gateway:
      # Spring Cloud Gateway 5.x：路由前缀从 spring.cloud.gateway.routes 改成 server.webflux.routes
      server:
        webflux:
          routes:
            # 各服务 /v3/api-docs 转发：去掉前缀服务名后转发，供文件末尾 springdoc.swagger-ui.urls 聚合
            - id: auth-service-api-docs
              uri: lb://auth-service
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/(?<segment>.*), /$\{segment}
            - id: shop-service-api-docs
              uri: lb://shop-service
              predicates:
                - Path=/shop-service/v3/api-docs
              filters:
                - RewritePath=/shop-service/(?<segment>.*), /$\{segment}
            - id: product-service-api-docs
              uri: lb://product-service
              predicates:
                - Path=/product-service/v3/api-docs
              filters:
                - RewritePath=/product-service/(?<segment>.*), /$\{segment}
            - id: order-service-api-docs
              uri: lb://order-service
              predicates:
                - Path=/order-service/v3/api-docs
              filters:
                - RewritePath=/order-service/(?<segment>.*), /$\{segment}
            - id: aftersale-service-api-docs
              uri: lb://aftersale-service
              predicates:
                - Path=/aftersale-service/v3/api-docs
              filters:
                - RewritePath=/aftersale-service/(?<segment>.*), /$\{segment}
            - id: user-service-api-docs
              uri: lb://user-service
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/(?<segment>.*), /$\{segment}
            - id: file-service-api-docs
              uri: lb://file-service
              predicates:
                - Path=/file-service/v3/api-docs
              filters:
                - RewritePath=/file-service/(?<segment>.*), /$\{segment}
            - id: ai-agent-service-api-docs
              uri: lb://ai-agent-service
              predicates:
                - Path=/ai-agent-service/v3/api-docs
              filters:
                - RewritePath=/ai-agent-service/(?<segment>.*), /$\{segment}
            # 登录/登出/用户信息 → auth-service（放在最前，优先匹配）
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/login,/api/logout,/api/admin/info
            # 店铺 → shop-service（开沙箱/当前店铺；/api/shops/sandbox 免登录）
            - id: shop-service
              uri: lb://shop-service
              predicates:
                - Path=/api/shops,/api/shops/**,/api/admin/shops,/api/admin/shops/**
            # 商品浏览 → product-service；必须放在 user-service 的 /api/** 通配之前，更具体的规则优先匹配。
            # 裸路径（/api/products）是列表接口，/** 是详情等子路径，两者都要覆盖。
            # /image/** 是商品图片静态资源，同样由 product-service 托管（见 common WebMvcConfig 的 addResourceHandlers）。
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products,/api/products/**,/api/categories,/api/categories/**,/api/tags,/api/tags/**,/api/admin/products,/api/admin/products/**,/api/admin/categories,/api/admin/categories/**,/api/admin/tags,/api/admin/tags/**,/api/admin/stock,/api/admin/stock/**,/api/admin/upload,/api/admin/upload/**,/api/upload,/api/upload/**,/image/**
            # 购物车 + 订单 → order-service；放在 /api/** 通配之前（操作需登录，鉴权由下游 JwtInterceptor 承担）
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/cart,/api/cart/**,/api/orders,/api/orders/**,/api/address,/api/address/**,/api/admin/orders,/api/admin/orders/**
            # 售后 → aftersale-service；放在 /api/** 通配之前（操作需登录，鉴权由下游 JwtInterceptor 承担）
            - id: aftersale-service
              uri: lb://aftersale-service
              predicates:
                - Path=/api/after-sales,/api/after-sales/**,/api/admin/after-sales,/api/admin/after-sales/**
            # AI 导购助手 → ai-agent-service；同样放在 /api/** 通配之前
            - id: ai-agent-service
              uri: lb://ai-agent-service
              predicates:
                - Path=/api/agent,/api/agent/**
            # 后台来单提醒 WebSocket → order-service（前端 ws://网关/ws/order?token=xxx，握手鉴权在 order-service）
            - id: order-service-ws
              uri: lb://order-service
              predicates:
                - Path=/ws/**
            # 用户头像等上传文件 → user-service：库里存相对路径 /upload/avatar/xxx，
            # 静态映射见 common WebMvcConfig（/upload/** → file:upload/）。
            # 与 /image/**（商品图）对称：都是静态资源，不在 /api/** 内，免登录。
            - id: user-service-upload
              uri: lb://user-service
              predicates:
                - Path=/upload/**
            # 阶段 0 冒烟：其余 /api/** 暂转给 user-service，JWT 鉴权仍由下游拦截器承担
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/**
              filters:
                # 保留客户端原始 Host：user-service 用它拼头像等绝对 URL（UrlUtil.fullUrl）。
                # 不保留时下游看到的 Host 是 lb 解析出的实例地址（如 192.168.92.1:9006），
                # 而网关又会把 X-Forwarded-Host 覆盖成同一个实例地址，两个头都拿不到客户端域名 → 真机加载不到头像。
                - PreserveHostHeader

server:
  port: 8080

# Swagger 文档聚合：一个入口 http://localhost:8080/swagger-ui.html，下拉切换各服务
springdoc:
  swagger-ui:
    enabled: true
    urls:
      - name: 登录 auth-service
        url: /auth-service/v3/api-docs
      - name: 店铺 shop-service
        url: /shop-service/v3/api-docs
      - name: 商品 product-service
        url: /product-service/v3/api-docs
      - name: 订单 order-service
        url: /order-service/v3/api-docs
      - name: 售后 aftersale-service
        url: /aftersale-service/v3/api-docs
      - name: 用户 user-service
        url: /user-service/v3/api-docs
      - name: 文件 file-service
        url: /file-service/v3/api-docs
      - name: AI 助手 ai-agent-service
        url: /ai-agent-service/v3/api-docs
