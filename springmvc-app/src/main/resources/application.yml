spring:
  application:
    name: SpringMVCdemo1
  datasource:
    url: jdbc:mysql://localhost:3306/springmvc_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      pool-name: MyHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

person:
  name: admin
  age: 28

user:
  salary: 10000
  hobbies: sing,jump,rap,basketball
  birth: 2000/01/01


logging:
  level:
    root: INFO
    mvcdemo.springmvcdemo1: trace
    org.springframework: WARN
    org.springframework.boot: WARN
    org.springframework.web: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    org.apache.tomcat: WARN
    org.apache.catalina: WARN
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%-5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"